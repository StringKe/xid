[package]
name = "xid"
version = "0.1.0"
edition = "2021"
description = "XID identity platform server-side SDK for Rust"
license = "MIT"
repository = "https://github.com/StringKe/xid"
keywords = ["xid", "auth", "jwt", "oidc", "identity"]
categories = ["authentication", "web-programming"]

[lib]
name = "xid"
path = "src/lib.rs"

[dependencies]
# JWT 验证:支持 ES256 / RS256,JWKS 解析
jsonwebtoken = { version = "10.3.0", features = ["aws_lc_rs"] }

# HTTP 客户端:拉 JWKS,启用 rustls 避免 OpenSSL 依赖
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# 序列化 / 反序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 异步运行时
tokio = { version = "1", features = ["sync", "time"] }

# 时间处理
chrono = { version = "0.4", features = ["serde"] }

# HMAC-SHA256 用于 webhook 验证
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

# 错误处理
thiserror = "1"

# 结构化日志(JWKS 单条 key 解析失败时 warn)
tracing = "0.1"

# 可选框架集成
axum = { version = "0.8", optional = true }
actix-web = { version = "4", optional = true }

[features]
default = []
axum = ["dep:axum"]
actix-web = ["dep:actix-web"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
