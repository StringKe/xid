[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xid"
version = "0.1.0"
description = "XID Identity Platform - Python Server SDK"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["xid", "oidc", "jwt", "identity", "authentication"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = ["pyjwt[crypto]>=2.8.0,<3.0", "cryptography>=42.0,<49.0", "httpx>=0.27.0,<1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-httpx>=0.30", "mypy>=1.10", "ruff>=0.4"]

[project.urls]
Homepage = "https://xid.dev"
Repository = "https://github.com/StringKe/xid"

[tool.hatch.build.targets.wheel]
packages = ["xid"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
