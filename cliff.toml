# git-cliff configuration for repository releases.
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.

The format is based on [Keep a Changelog 1.1.0](https://keepachangelog.com/en/1.1.0/), and this
project adheres to [Semantic Versioning 2.0.0](https://semver.org/spec/v2.0.0.html).

This file is generated by [git-cliff](https://github.com/orhun/git-cliff) from Conventional Commits.
Run `pnpm changelog --tag vX.Y.Z` to prepare a release; do not edit it by hand.\n
"""
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim }}\n
    {%- for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif -%}
          {{ commit.message | upper_first | trim }} \
          ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/StringKe/xid/commit/{{ commit.id }}))\
    {% endfor %}
{% endfor %}\n
"""
footer = """
[Unreleased]: https://github.com/StringKe/xid/commits/main
{% for release in releases -%}
    {% if release.version -%}
        [{{ release.version | trim_start_matches(pat="v") }}]: \
        https://github.com/StringKe/xid/releases/tag/{{ release.version }}
    {% endif -%}
{% endfor %}
<!-- generated by git-cliff -->
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
require_conventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
fail_on_unmatched_commit = true
tag_pattern = '^v[0-9]+\.[0-9]+\.[0-9]+$'
topo_order = true
topo_order_commits = true
sort_commits = "newest"
commit_parsers = [
  { message = '^Merge ', skip = true },
  { message = '^chore\(release\)', skip = true },
  { message = '^revert', group = '<!-- 00 -->Reverted' },
  { message = '^fix\(security\)', group = '<!-- 10 -->Security' },
  { message = '^fix\(deps\)', group = '<!-- 10 -->Security' },
  { message = '^fix\(python\): bump cryptography', group = '<!-- 10 -->Security' },
  { message = '^feat', group = '<!-- 20 -->Added' },
  { message = '^fix', group = '<!-- 30 -->Fixed' },
  { message = '^perf', group = '<!-- 40 -->Performance' },
  { message = '^refactor', group = '<!-- 50 -->Changed' },
  { message = '^docs', group = '<!-- 60 -->Documentation' },
  { message = '^test', group = '<!-- 70 -->Testing' },
  { message = '^build', group = '<!-- 80 -->Build' },
  { message = '^ci', group = '<!-- 80 -->Build' },
  { message = '^chore\(deps\)', group = '<!-- 90 -->Dependencies' },
  { message = '^chore', group = '<!-- 91 -->Maintenance' },
  { message = '^style', group = '<!-- 91 -->Maintenance' },
]
link_parsers = [
  { pattern = '#(\d+)', href = 'https://github.com/StringKe/xid/pull/$1' },
]
