name: OpenSSF Scorecard

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    # 每周一 04:41 UTC
    - cron: '41 4 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  analysis:
    name: Run Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # 把 SARIF 写进 code scanning
      security-events: write
      # publish_results 用 OIDC 向 OpenSSF API 证明身份,不需要 PAT
      id-token: write
      actions: read
    steps:
      # actions/checkout v7.0.1
      # persist-credentials: false 是 Scorecard 的硬性要求,避免 GITHUB_TOKEN 留在 .git/config
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # ossf/scorecard-action v2.4.4
      - id: scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc
        with:
          results_file: results.sarif
          results_format: sarif
          # 公开分数,让 README badge 与 deps.dev 能取到结果。仓库必须是 public。
          publish_results: true

      # actions/upload-artifact v7.0.1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      # github/codeql-action v4.38.0
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          sarif_file: results.sarif
