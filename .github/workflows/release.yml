name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Validate annotated SemVer tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = "tag"
          package_version="$(node -p \
            "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          test "$GITHUB_REF_NAME" = "v$package_version"
          grep -F "## [$package_version]" CHANGELOG.md

      # git-cliff --current sorts tags lexically, so v0.0.10 resolved to the whole history.
      - name: Resolve release range
        id: range
        shell: bash
        run: |
          set -euo pipefail
          previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' "$GITHUB_REF_NAME^")"
          echo "range=$previous..$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      # orhun/git-cliff-action v4.9.0, running git-cliff v2.13.1
      - name: Generate release notes
        id: git-cliff
        uses: orhun/git-cliff-action@3d96a18cc4ec17e9dc69ddcc424ccafaf1f78ce2
        with:
          version: v2.13.1
          config: cliff.toml
          args: --strip all --verbose ${{ steps.range.outputs.range }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Validate release notes
        shell: bash
        run: |
          set -euo pipefail
          test -s RELEASE_NOTES.md
          grep -F "## [${GITHUB_REF_NAME#v}]" RELEASE_NOTES.md
          test "$(grep -c '^## \[' RELEASE_NOTES.md)" = "1"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub Release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          # No build, package publication, container, or custom release asset is produced here.
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            --latest
