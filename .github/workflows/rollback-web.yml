name: Coordinated web rollback

on:
  workflow_run:
    workflows:
      - Coordinated web release
    types:
      - completed
    branches:
      - main

concurrency:
  group: xid-web-production
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  deployments: write

jobs:
  rollback:
    name: recover failed coordinated release
    if: >-
      ${{
        github.event.workflow_run.event == 'workflow_dispatch' &&
        github.event.workflow_run.conclusion != 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production-rollback
      url: https://xid.dev
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Verify trusted source workflow
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$SOURCE_WORKFLOW_NAME" = "Coordinated web release"
          test "$SOURCE_EVENT" = "workflow_dispatch"
          test "$SOURCE_HEAD_BRANCH" = "main"
          test "$SOURCE_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "origin/$DEFAULT_BRANCH")"
          git merge-base --is-ancestor "$RELEASE_SHA" HEAD
      # pnpm/action-setup v6.0.9
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore compatibility Core before changing routes
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: >-
          timeout 2400 node scripts/run-web-release.mjs recover-rollback
          --workflow-run-id "$SOURCE_RUN_ID"
          --workflow-run-attempt "$SOURCE_RUN_ATTEMPT"
          --release-git-sha "$RELEASE_SHA"
      # actions/upload-artifact v7.0.1
      - name: Preserve rollback recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: web-rollback-${{ github.event.workflow_run.id }}-source-attempt-${{ github.event.workflow_run.run_attempt }}-recovery-attempt-${{ github.run_attempt }}
          path: .xid/releases
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
