name: Coordinated web release

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Unique release id, for example xid-web-20260727-001
        required: true
        type: string
      release_sha:
        description: Full reviewed commit SHA on main
        required: true
        type: string
      compat_core_sha:
        description: Full commit SHA that still contains the public UI and Console fallback
        required: true
        type: string
      confirm:
        description: Enter DEPLOY_XID_WEB
        required: true
        type: string

concurrency:
  group: xid-web-production
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  deployments: write

jobs:
  release:
    name: coordinated release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: production
      url: https://xid.dev
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify trusted dispatch inputs
        env:
          COMPAT_CORE_SHA: ${{ inputs.compat_core_sha }}
          CONFIRM_RELEASE: ${{ inputs.confirm }}
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_ID" =~ ^[a-z0-9][a-z0-9-]{2,63}$ ]]
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$COMPAT_CORE_SHA" = "995f65c6aae0bdc77e8a0fdbf0222f51143ce2d2"
          test "$CONFIRM_RELEASE" = "DEPLOY_XID_WEB"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
      # pnpm/action-setup v6.0.9
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: prepare
        name: Verify release preconditions
        env:
          COMPAT_CORE_SHA: ${{ inputs.compat_core_sha }}
          CONFIRM_RELEASE: ${{ inputs.confirm }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: >-
          node scripts/run-web-release.mjs prepare
          --release-id "$RELEASE_ID"
          --release-git-sha "$RELEASE_SHA"
          --compat-core-git-sha "$COMPAT_CORE_SHA"
          --confirm "$CONFIRM_RELEASE"
      - id: release
        name: Release compatibility Core, Console, Site, and tight Core
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_MANIFEST: .xid/releases/${{ inputs.release_id }}/manifest.json
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
          timeout 4500 node scripts/run-web-release.mjs release --manifest "$RELEASE_MANIFEST"
      # actions/upload-artifact v7.0.1
      - name: Preserve release manifest and artifacts
        if: always() && steps.prepare.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.release_id }}-state-attempt-${{ github.run_attempt }}
          path: .xid/releases/${{ inputs.release_id }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
